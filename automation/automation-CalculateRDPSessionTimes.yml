script: |
  register_module_line('CalculateRDPSessionTimes', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.3.38'
  demisto.debug('pack id = CortexResponseAndRemediation, pack version = 1.3.38')
  """Calculate RDP session times from input data."""

  import json
  from datetime import UTC, datetime, timedelta
  from typing import Any




  DATE_FORMAT = "%Y-%m-%d %H:%M:%S"


  def normalize_input(raw_input: str | dict | list) -> list[dict[str, Any]] | None:
      """Normalize the input from demisto arguments into a list of dictionaries.
      Handles JSON strings, single dictionaries, and dictionaries of dictionaries.
      """
      if isinstance(raw_input, str):
          try:
              data_list = json.loads(raw_input)
          except json.JSONDecodeError as err:
              raise ValueError("The 'input' argument is a string but not valid JSON.") from err
      else:
          data_list = raw_input

      if isinstance(data_list, dict):
          # Handle single entry dict
          if "action_remote_ip" in data_list:
              return [data_list]
          # Handle dict of dicts
          return list(data_list.values())

      if not isinstance(data_list, list):
          raise TypeError(f"The 'input' argument could not be converted to a list. Received type: {type(data_list)}")

      return data_list


  def process_rdp_entry(item: dict[str, Any]) -> dict[str, Any] | None:
      """Processes a single RDP log entry to calculate session times.
      Returns a dictionary with calculated fields or None if processing fails.
      """
      remote_ip = item.get("action_remote_ip")
      duration_ms = item.get("action_session_duration")
      epoch_time = item.get("_time")

      if not all((remote_ip, duration_ms is not None, epoch_time is not None)):
          return None

      try:
          session_duration_minutes = float(duration_ms / 60000)  # type: ignore[operator]
          ts_seconds = int(epoch_time) / 1000  # type: ignore[arg-type]
          base_timestamp_dt = datetime.fromtimestamp(ts_seconds, tz=UTC)
          query_start_dt = base_timestamp_dt - timedelta(minutes=1)
          duration_timedelta = timedelta(milliseconds=duration_ms)  # type: ignore[arg-type]
          query_end_dt = base_timestamp_dt + duration_timedelta + timedelta(minutes=1)

          return {
              "ip": remote_ip,
              "session_duration": session_duration_minutes,
              "timestamp": base_timestamp_dt.strftime(DATE_FORMAT),
              "session_start": query_start_dt.strftime(DATE_FORMAT),
              "session_end": query_end_dt.strftime(DATE_FORMAT),
          }
      except (ValueError, TypeError) as e:
          demisto.info(f"Failed to process time data ({epoch_time}, {duration_ms}): {e}")
          return None


  def calculate_rdp_session_times(raw_input: str | dict | list) -> CommandResults:
      """Main logic to calculate RDP session times from context data."""
      data_list = normalize_input(raw_input)

      if data_list is None:
          # An error was already raised by normalize_input, return empty results
          raise ValueError("Invalid input provided.")

      rdp_entries = []
      for item in data_list:
          if isinstance(item, dict):
              processed_entry = process_rdp_entry(item)
              if processed_entry:
                  rdp_entries.append(processed_entry)

      return CommandResults(
          outputs_prefix="RDP",
          outputs_key_field="ip",
          outputs=rdp_entries,
          readable_output=tableToMarkdown(
              "RDP Session Data", rdp_entries, headers=["timestamp", "session_start", "session_end", "ip", "session_duration"]
          ),
          raw_response=rdp_entries,
      )


  def main() -> None:
      """Entry point for the script."""
      try:
          raw_input = demisto.args().get("input")
          return_results(calculate_rdp_session_times(raw_input))
      except Exception as e:  # pylint: disable=broad-exception-caught
          return_error(f"Failed to execute script. Error: {e!s}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('CalculateRDPSessionTimes', 'end', __line__())
