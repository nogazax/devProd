script: |
  register_module_line('CalculateVNCSessionTimes', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.3.37'
  demisto.debug('pack id = CortexResponseAndRemediation, pack version = 1.3.37')
  """Calculate VNC session times from input data."""

  import json
  import traceback
  from typing import Any, NoReturn




  END_TIME_BUFFER_MS = 5 * 1000  # 5 seconds


  def _raise_invalid_input_format_error() -> NoReturn:
      """Raise a ValueError for invalid input data format."""
      raise ValueError("Invalid input data format.")


  def normalize_input(raw_input: str | list) -> list[dict[str, Any]] | None:
      """Normalize the input into a list of dictionaries."""
      if isinstance(raw_input, str):
          try:
              return json.loads(raw_input)
          except json.JSONDecodeError as e:
              raise ValueError(f"Input string is invalid JSON: {e}") from e
      if isinstance(raw_input, list):
          return raw_input
      return None


  def process_vnc_entry(event: dict[str, Any]) -> dict[str, Any] | None:
      """Processes a single VNC log entry to calculate session times."""
      timestamp = event.get("_time")
      duration_ms = event.get("action_network_session_duration")
      remote_ip = event.get("action_remote_ip")

      if not all((timestamp, duration_ms is not None, remote_ip)):
          demisto.debug(f"Skipping event due to missing required fields: {event}")
          return None

      try:
          timestamp = int(timestamp)  # type: ignore[arg-type]
          duration_ms = int(duration_ms)  # type: ignore[arg-type]
      except (ValueError, TypeError):
          demisto.debug(f"Skipping event due to invalid number format: {event}")
          return None

      if duration_ms == 0:
          demisto.debug(f"Skipping event with 0 duration: IP {remote_ip}")
          return None

      session_start_ms = timestamp - duration_ms
      session_end_ms = timestamp + END_TIME_BUFFER_MS

      return {
          "ip": remote_ip,
          "session_start": timestamp_to_datestring(session_start_ms),
          "session_end": timestamp_to_datestring(session_end_ms),
          "command_line": event.get("actor_process_command_line"),
          "image_name": event.get("actor_process_image_name"),
      }


  def calculate_session_times(input_data: str | list) -> list[dict[str, Any]]:
      """Core logic to calculate and format session times."""
      events = normalize_input(input_data)
      if events is None:
          _raise_invalid_input_format_error()

      results = []
      for event in events:
          if isinstance(event, dict):
              try:
                  processed_entry = process_vnc_entry(event)
                  if processed_entry:
                      results.append(processed_entry)
              except Exception as e:
                  error_traceback = traceback.format_exc()
                  demisto.error(f"Error processing event: {event}. Error: {e}\nTraceback: {error_traceback}")
      return results


  def main() -> None:
      """Main function to run the script."""
      try:
          args = demisto.args()
          raw_input = args.get("input")

          final_output_list = calculate_session_times(raw_input)

          if not final_output_list:
              # Return empty results if no sessions were processed
              return_results(CommandResults(readable_output="No VNC sessions found or processed."))

          return_results(
              CommandResults(
                  outputs_prefix="VNC",
                  outputs=final_output_list,
                  readable_output=tableToMarkdown(
                      "Calculated VNC Session Times",
                      final_output_list,
                      headers=["ip", "session_start", "session_end", "command_line", "image_name"],
                  ),
                  raw_response=final_output_list,
              )
          )

      except Exception as e:
          full_traceback = traceback.format_exc()
          return_error(f"Failed to execute script. Error: {e!s}\nFull Traceback:\n{full_traceback}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('CalculateVNCSessionTimes', 'end', __line__())
