script: |
  register_module_line('CoreIsolateEndpoint', 'start', __line__())
  CONSTANT_PACK_VERSION = '3.5.33'
  demisto.debug('pack id = Core, pack version = 3.5.33')




  def main():
      args = demisto.args()
      try:
          return_results(execute_polling_command("core-isolate-endpoint", args))
      except Exception as e:
          return_error(f"Failed to execute script.\nError:\n{e!s}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('CoreIsolateEndpoint', 'end', __line__())
