script: |
  register_module_line('ParseAndAnalyzeCommandLines', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.3.39'
  demisto.debug('pack id = CortexResponseAndRemediation, pack version = 1.3.39')
  """Parse and analyze command lines from input data."""

  import json
  from typing import Any





  def normalize_input(raw_input: str | dict | list) -> list[dict[str, Any]] | None:
      """Normalize the input from demisto arguments into a list of dictionaries."""
      if isinstance(raw_input, str):
          try:
              data_list = json.loads(raw_input)
          except json.JSONDecodeError as err:
              raise ValueError("The 'input' argument is a string but not valid JSON.") from err
      else:
          data_list = raw_input

      if isinstance(data_list, dict):
          return [data_list]

      if not isinstance(data_list, list):
          raise TypeError(f"The 'input' argument could not be converted to a list. Received type: {type(data_list)}")

      return data_list


  def group_commands_by_ip(data_list: list[dict[str, Any]], field: str) -> dict[str, set[str]]:
      """Groups commands by IP address from a list of events."""
      grouped_data: dict[str, set[str]] = {}
      for item in data_list:
          if not isinstance(item, dict):
              continue

          remote_ip = item.get("agent_ip_addresses")
          command = item.get(field)

          if remote_ip and command is not None and isinstance(remote_ip, str):
              grouped_data.setdefault(remote_ip, set()).add(command)

      return grouped_data


  def analyze_commands(commands: list[str]) -> tuple[list[dict[str, Any]], int]:
      """Analyzes a list of commands using the CommandLineAnalysis automation."""
      string_commands = " , ".join(commands)
      res = demisto.executeCommand("CommandLineAnalysis", {"command_line": string_commands})

      if not res or not isinstance(res, list) or "Contents" not in res[0]:
          return [], 0

      analysis_results = res[0]["Contents"]
      if not isinstance(analysis_results, list):
          return [], 0

      analyzed_commands = []
      scores = []
      for result in analysis_results:
          score = result.get("score", 0)
          scores.append(score)
          analyzed_commands.append({"command": result.get("parsed_command", ""), "score": score})

      max_score = max(scores) if scores else 0
      return analyzed_commands, max_score


  def parse_and_analyze(raw_input: str | dict | list, prefix: str, field: str) -> CommandResults:
      """Main logic for parsing and analyzing command lines."""
      if not all((raw_input, prefix, field)):
          raise ValueError("Arguments 'input', 'context_prefix', and 'command_line_field' are mandatory.")

      data_list = normalize_input(raw_input)
      if data_list is None:
          raise ValueError("Invalid input provided.")

      grouped_data = group_commands_by_ip(data_list, field)
      final_results = []

      for ip, commands_set in grouped_data.items():
          analyzed_commands, max_score = analyze_commands(list(commands_set))
          final_results.append({"ip": ip, "max_score": max_score, "commands": analyzed_commands})

      demisto.executeCommand("DeleteContext", {"key": prefix})
      markdown = tableToMarkdown(f"Command Analysis by IP ({prefix})", final_results, headers=["ip", "max_score"], removeNull=True)

      return CommandResults(
          outputs_prefix=prefix, outputs_key_field="ip", outputs=final_results, readable_output=markdown, raw_response=final_results
      )


  def main() -> None:
      """Entry point for the script."""
      try:
          args = demisto.args()
          raw_input = args.get("input")
          prefix = args.get("context_prefix")
          field = args.get("command_line_field")
          results = parse_and_analyze(raw_input, prefix, field)

          if results:
              return_results(results)

      except Exception as e:  # pylint: disable=broad-exception-caught
          return_error(f"Failed to execute script. Error: {e!s}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('ParseAndAnalyzeCommandLines', 'end', __line__())
