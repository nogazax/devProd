comment: |-
  Reverse a list
  e.g. ["Mars", "Jupiter", "Saturn"] =>  ["Saturn", "Jupiter", "Mars"]

  This is an example for entire-list transformer - it operates the argument as a list  (note the "entirelist" tag).
