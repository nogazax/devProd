args:
- default: true
  description: A JSON object mapping RemoteAccess instances to filepaths.
  name: systems2files
  required: true
  supportedModules: []
comment: Take a list of devices and pull a specific file (given by path) from each
  using SCP.
commonfields:
  id: SCPPullFiles
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 5.0.0
    isoverridable: false
    itemVersion: 1.21.5
    packID: CommonScripts
    packName: Common Scripts
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    supportedModules: []
    toServerVersion: ""
dependson:
  must:
  - copy-from
dockerimage: demisto/python3:3.12.12.5490952
engineinfo: {}
mainengineinfo: {}
name: SCPPullFiles
nativeimage:
- "8.8"
- "8.6"
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('SCPPullFiles', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.21.5'
  demisto.debug('pack id = CommonScripts, pack version = 1.21.5')




  def scp_pull_files(args):
      res = []  # type: ignore
      s2f = demisto.get(args, "systems2files")
      if s2f:
          s2f = json.loads(s2f)
          if not isinstance(s2f, dict):
              res = {
                  "Type": entryTypes["error"],
                  "ContentsFormat": formats["text"],  # type: ignore
                  "Contents": "Wrong argument provided. Not a dict. Dump of args: " + json.dumps(args, indent=4),
              }
          else:
              for k in s2f:
                  res += demisto.executeCommand("copy-from", {"using": k, "file": s2f[k]})
                  demisto.info("Copying file " + s2f[k] + " from device " + k)
      return res


  def main():
      args = demisto.args()
      demisto.results(scp_pull_files(args))


  if __name__ in ["__main__", "builtin", "builtins"]:
      main()

  register_module_line('SCPPullFiles', 'end', __line__())
scripttarget: 0
