script: |
  register_module_line('SearchIndicatorInEventsAgentix', 'start', __line__())
  CONSTANT_PACK_VERSION = '3.5.32'
  demisto.debug('pack id = Core, pack version = 3.5.32')




  def main():
      args = demisto.args()
      args["time_frame"] = args.get("time_frame") or "7 days"
      try:
          return_results(execute_polling_command("SearchIndicatorInEvents", args))
      except Exception as e:
          return_error(f"Failed to execute script.\nError:\n{e!s}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('SearchIndicatorInEventsAgentix', 'end', __line__())
