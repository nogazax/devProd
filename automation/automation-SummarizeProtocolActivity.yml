script: |
  register_module_line('SummarizeProtocolActivity', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.3.39'
  demisto.debug('pack id = CortexResponseAndRemediation, pack version = 1.3.39')
  """Summarize protocol activity from context."""

  from typing import Any




  PROTOCOLS = ["SSH", "WMI", "Scheduler", "WinRM", "RDP", "VNC"]


  def get_protocol_keys(args: dict[str, Any]) -> list[str]:
      """Gets protocol keys from demisto arguments or uses defaults."""
      keys_arg = args.get("protocol_keys")
      if keys_arg and isinstance(keys_arg, str):
          return [k.strip() for k in keys_arg.split(",") if k.strip()]
      return PROTOCOLS


  def get_threshold(args: dict[str, Any]) -> float:
      """Gets the score threshold from demisto arguments or uses a default."""
      try:
          return float(args.get("threshold", 40))

      except (ValueError, TypeError):
          return 40.0


  def process_protocol_entry(
      entry: dict[str, Any],
      protocol: str,
      threshold: float,
      ip_aggregation: dict[str, list[dict[str, Any]]],
      suspicious_ips: set[str],
  ) -> None:
      """Processes a single protocol data entry."""
      ip = entry.get("ip")
      if not ip or not isinstance(ip, str):
          return

      entry_max_score = entry.get("max_score", 0)
      if isinstance(entry_max_score, int | float) and entry_max_score > threshold:
          suspicious_ips.add(ip)

      entry_details = {"protocol": protocol, "max_score": entry_max_score, "commands": entry.get("commands", [])}

      ip_aggregation.setdefault(ip, []).append(entry_details)


  def collect_protocol_data(protocol_keys: list[str], threshold: float) -> tuple[dict[str, list[dict[str, Any]]], set[str]]:
      """Collects and aggregates protocol data from the context."""
      ip_aggregation: dict[str, list[dict[str, Any]]] = {}
      suspicious_ips: set[str] = set()

      for protocol in protocol_keys:
          data = demisto.get(demisto.context(), protocol)
          if not data:
              continue

          if not isinstance(data, list):
              data = [data]

          for entry in data:
              if isinstance(entry, dict):
                  process_protocol_entry(entry, protocol, threshold, ip_aggregation, suspicious_ips)

      return ip_aggregation, suspicious_ips


  def format_commands(commands: list[dict[str, Any]]) -> str:
      """Formats command details for markdown output."""
      formatted_commands = []
      for cmd in commands:
          cmd_str = cmd.get("command", "N/A")
          cmd_score = cmd.get("score", 0)
          formatted_commands.append(f"`{cmd_str}` (Score: {cmd_score})")
      return "\n".join(formatted_commands) if formatted_commands else "No specific commands captured"


  def build_ip_markdown_table(ip: str, protocols: list[dict[str, Any]]) -> str:
      """Builds a markdown table for a single IP's protocol activity."""
      md_output = f"#### Target IP: {ip}\n"
      table_data = []
      for p in protocols:
          table_data.append(
              {
                  "Protocol": p.get("protocol", "N/A"),
                  "Max Score": p.get("max_score", 0),
                  "Commands Executed": format_commands(p.get("commands", [])),
              }
          )

      md_output += tableToMarkdown(
          name="", t=table_data, headers=["Protocol", "Max Score", "Commands Executed"], headerTransform=pascalToSpace
      )
      return md_output + "\n"


  def build_markdown_output(ip_aggregation: dict[str, list[dict[str, Any]]], protocol_keys: list[str]) -> str:
      """Builds the complete markdown output for the aggregated data."""
      md_output = "### Lateral Movement & Execution Summary\n"
      if not ip_aggregation:
          return md_output + f"No relevant protocol activity ({', '.join(protocol_keys)}) found in context."

      for ip, protocols in ip_aggregation.items():
          md_output += build_ip_markdown_table(ip, protocols)

      return md_output


  def aggregate_protocol_data(args: dict) -> CommandResults:
      """Iterates through context keys, aggregates data by IP, and produces output."""
      protocol_keys = get_protocol_keys(args)
      threshold = get_threshold(args)

      ip_aggregation, suspicious_ips = collect_protocol_data(protocol_keys, threshold)

      md_output = build_markdown_output(ip_aggregation, protocol_keys)

      summary_context = {
          "Summary": {"Raw": ip_aggregation, "HumanReadable": md_output, "SuspiciousRemoteHosts": sorted(suspicious_ips) or "None"}
      }

      return CommandResults(readable_output=md_output, outputs=summary_context, raw_response=summary_context)


  def main():
      """Main function to run the script."""
      try:
          args = demisto.args()
          return_results(aggregate_protocol_data(args))
      except Exception as e:  # pylint: disable=broad-exception-caught
          return_error(f"Failed to execute context aggregator: {e!s}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('SummarizeProtocolActivity', 'end', __line__())
