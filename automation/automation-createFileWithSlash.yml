script: |
  import os

  # Create a temp file with content
  temp_id = demisto.uniqueFile()
  inv_id = demisto.investigation()['id']
  filename = inv_id + '_' + temp_id

  with open(filename, 'w') as f:
      f.write("This is test content simulating an email file")

  # Return a file result with "/" in the File name
  # This simulates what happens when an email has a name like "Faktura Fm / 9880 / 2026.eml"
  demisto.results({
      'Contents': '',
      'ContentsFormat': 'text',
      'Type': 3,
      'File': 'Faktura Fm / 9880 / 2026.eml',
      'FileID': temp_id
  })
