        choose a subnet, we will use a default one from your default VPC. If you don't
        have a default VPC, you must specify a subnet ID yourself in the request.
      name: subnet_id
      supportedModules: []
    - description: The user data to make available to the instance. This value will
        be base64 encoded automatically. Do not base64 encode this value prior to
        performing the operation.
      name: user_data
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: "false"
      description: Indicates whether termination protection is enabled for the instance.
        The default is false, which means that you can terminate the instance using
        the Amazon EC2 console, command line tools, or API.
      name: disable_api_termination
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - description: The Amazon Resource Name (ARN) of the instance profile. Both iam_instance_profile_arn
        and iam_instance_profile_name are required if you would like to associate
        an instance profile.
      name: iam_instance_profile_arn
      supportedModules: []
    - description: The name of the instance profile. Both iam_instance_profile_arn
        and iam_instance_profile_name are required if you would like to associate
        an instance profile.
      name: iam_instance_profile_name
      supportedModules: []
    - description: The name of the key pair. Warning - If you do not specify a key
        pair, you can't connect to the instance unless you choose an AMI that is configured
        to allow users another way to log in.
      name: key_name
      supportedModules: []
    - auto: PREDEFINED
      description: Indicates whether the instance is optimized for Amazon EBS I/O.
      name: ebs_optimized
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - description: The device name (for example, /dev/sdh or xvdh). If the argument
        is given, EBS arguments must also be specified.
      name: device_name
      supportedModules: []
    - description: The size of the volume, in GiBs. You must specify either an ebs_snapshot_id
        or an ebs_volume_size. If you specify a snapshot, the default is the snapshot
        size. You can specify a volume size that is equal to or larger than the snapshot
        size.
      name: ebs_volume_size
      supportedModules: []
    - auto: PREDEFINED
      description: The volume type.
      name: ebs_volume_type
      predefined:
      - gp2
      - gp3
      - io1
      - io2
      - st1
      - sc1
      - standard
      supportedModules: []
    - description: The number of I/O operations per second (IOPS). For gp3, io1, and
        io2 volumes, this represents the number of IOPS that are provisioned for the
        volume. For gp2 volumes, this represents the baseline performance of the volume
        and the rate at which the volume accumulates I/O credits for bursting. This
        parameter is required for io1 and io2 volumes. The default for gp3 volumes
        is 3,000 IOPS.
      name: ebs_iops
      supportedModules: []
    - auto: PREDEFINED
