            """

            kwargs = {"GroupId": args.get("group_id"), "IpProtocol": args.get("protocol"), "CidrIp": args.get("cidr")}
            kwargs["FromPort"], kwargs["ToPort"] = handle_port_range(args)

            if ip_permissions := args.get("ip_permissions"):
