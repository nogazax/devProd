description: This playbook is triggered by an alert for the creation of a remote service
  with an uncommon name using the RPC over SMB protocol. It is designed to automatically
  investigate and respond to this activity, which is a common lateral movement technique
  used by attackers to establish persistence and execute malicious code on remote
  systems. The playbook analyzes the service, process, and network activity, and if
  the activity is deemed malicious, it will automatically perform remediation steps
  such as isolating the endpoint and removing the malicious service.
id: silent-A remote service with an uncommon name was created via RPC over SMB
inputs: []
issilent: true
