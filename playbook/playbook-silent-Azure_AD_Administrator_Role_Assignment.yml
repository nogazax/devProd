description: "### This playbook addresses the following alerts:\n- Suspicious Azure
  AD Administrator Role assignment.\n- Identity assigned an Azure AD Administrator
  Role by an Application.\n\n### Playbook Stages:\n\n#### Triage:\n- Gather additional
  information about the **assignor and assignee identities** involved in the admin
  role assignment, as well as **any anomalies** related to the alert.\n\n#### Investigation:\n-
  Assignor/Assignee Identities Analysis:\n  - Assess the **risk level** of the user
  in Cortex. \n  - Search for medium/high risk level **Azure Risk Detections and Defender
  Alerts** from the past day.\n  - Mark if the user is **new**.\n- Analyze the reputation
  of the assigning **IP address**.\n- Check for anomalies in **User Agent, ASN, and
  country**.\n\n#### Verdict:\n- If **either** the assignor and assignee identities
  are identical *OR* an application assigned the admin role for the first time from
  a rare IP, **AND** at least two evidence items were found.\n- If at least three
  evidence items include a mix of *global evidence with assignor-related evidence*,
  **OR** a mix of *global evidence with assignee-related evidence*.\n\n#### Remediation:\n-
  *Immediately* revoke the assignor's user sessions.\n- Remove the admin role assignment
  (*approval needed*).\n- Disable the assignor user and/or the assignee user (*approval
  needed*).\n\n### Requirements:\n- *For Investigation Steps:*\n  - `Azure Risky Users`
  or `MSGraph Identity and Access` for retrieving **Azure Risk Detections**.\n  -
  `Microsoft 365 Defender` for retrieving **Defender Alerts**.\n  - `Microsoft Graph
  User` for retrieving user properties.\n- *For Remediation Steps:*\n  - `Microsoft
  Graph Identity and Access` for removing the admin role assignment.\n  - `Microsoft
  Graph User` for revoking user sessions and for disabling users."
