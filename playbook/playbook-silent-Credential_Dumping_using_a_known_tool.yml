description: |-
  This playbook addresses the following alerts:
  - Credential Dumping using a known tool

  Playbook Stages:

  Data Collection:

  - Enriches file hashes for any involved processes not signed by Microsoft to determine their reputation.
  - Gathers comprehensive endpoint details, including its status, type, and overall risk score.
  - Retrieves the risk score and attributes for the user account associated with the alert.
  - Searches for other high or critical severity alerts that are related to the current alert.

  Early Containment:

  - Checks if the agent has already blocked the malicious process causality chain.
  - Terminates the entire causality process tree to prevent further malicious activity if it was not already blocked.

  Investigation:

  - Identifies that a known credential dumping tool was detected, creating initial evidence of malicious intent.
  - Examines command line history for the presence of keywords related to attack simulation tools.
  - Analyzes command line arguments for suspicious patterns and extracts any embedded indicators like IPs or domains.
  - Checks if any extracted indicators from the command line have a malicious or suspicious reputation.
  - Determines if the involved process hash has a known malicious or suspicious reputation from threat intelligence.
  - Evaluates if the host has a high risk score, indicating a history of suspicious activity.
  - Checks if the user involved in the alert is classified as a high-risk user.
  - Scans command line arguments to identify if a credential dump file was created and its location.

  Verdict:

  - Evaluates the cumulative score from all collected evidence to determine if the activity is malicious.
  - Decides whether to proceed with remediation actions based on the final verdict.

  Remediation:

  - Isolates the compromised endpoint from the network to prevent lateral movement, pending analyst approval.
  - Disables the involved user account in identity services to block further access, pending analyst approval.
  - Initiates a logoff for the user from the affected endpoint to terminate any active sessions.
  - Blocks any malicious IP addresses, file hashes, or domains identified during the investigation.
  - Creates a task for the analyst to manually delete any credential dump files from the endpoint.
  - After remediation, prompts an analyst to confirm the resolution before closing the alert.
