description: |-
  This playbook is designed to handle the following alerts:
  - Command-line arguments match Mimikatz execution
  - Mimikatz command-line arguments
  - Credential dumping via wce.exe
  - Credential dumping via gsecdump.exe
  - PowerShell runs with known Mimikatz arguments
  - Hash cracking using Hashcat tool
  - Credential dumping via fgdump.exe
  - Credential dumping via LaZagne
  - Credential dumping via pwdumpx.exe
  - Dumping lsass.exe memory for credential extraction
  - Memory dumping with comsvcs.dll

  The playbook executes the following stages:

  Data Collection:
  - Enriches process reputation for CGO, OS Actor, Actor, and Action processes (excluding Microsoft-signed binaries)
  - Retrieves host and user risk scores
  - Collects endpoint information

  Investigation:
  - Records evidence of credential dumping tool usage
  - Searches for related alerts within the same case
  - Analyzes host and user risk scores
  - Performs command-line analysis to detect malicious patterns
  - Enriches and validates reputation of extracted indicators (IPs, domains, URLs, files)
  - Checks if the attack was triggered by an attack simulation tool
  - Extracts and identifies dump file locations from command lines

  Verdict:
  - Evaluates collected evidence with weighted scoring
  - Determines if remediation is required based on evidence threshold (score ≥ 3)
  - Checks if the causality process was already blocked by the agent

  Early Containment:
  - Terminates the causality process tree
  - Provides manual termination guidance if automated termination fails

  Remediation (executed if malicious evidence is found):
  - Block IOCs and Quarantine:
    * Blocks malicious file hashes via blocklist
    * Blocks malicious IP addresses
    * Blocks malicious URLs using custom URL categories
    * Adds malicious domains as indicator rules
  - User Actions:
    * Disables compromised user accounts (with analyst approval, excluding system accounts)
    * Logs off active user sessions from affected endpoints
  - Endpoint Isolation:
    * Isolates workstation endpoints that are connected and not already isolated
    * Requires analyst approval for isolation
    * Skips isolation for servers and disconnected endpoints with manual remediation guidance
  - Dump File Handling:
    * Provides manual guidance to delete identified credential dump files

  Alert Closure:
  - Requests analyst approval to resolve the alert as True Positive
  - Closes the alert with appropriate resolution notes
id: silent-Credential Dumping using a known tool Test
