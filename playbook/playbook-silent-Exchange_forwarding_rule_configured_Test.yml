        simple: "dataset = saas_audit_logs \n| filter service_type = ENUM.Exchange
          \n  and service_sub_type in (ENUM.ExchangeAdmin, ENUM.ExchangeItem)\n  and
          operation_name_orig in (\"New-InboxRule\", \"Set-InboxRule\", \"UpdateInboxRules\",
          \"New-TransportRule\", \"Set-TransportRule\")\n  and operation_status =
          ENUM.SUCCESS\n  and identity_name != \"${Core.OriginalAlert.event.identity_name}\"\n|
          alter parameters_array = json_extract_array(raw_log, \"$.Parameters\")\n|
          alter contains_words_params = arrayfilter(parameters_array, json_extract_scalar(\"@element\",
          \"$.Name\") in (\"BodyContainsWords\", \"SubjectContainsWords\", \"SubjectOrBodyContainsWords\"))\n|
          alter contains_words = json_extract_scalar(arrayindex(contains_words_params,
          0), \"$.Value\")\n| filter contains_words = \"${Core.OriginalAlert.event.exchange_rule_keywords}\"\n|
          fields _time, event_id, identity_name, contains_words"
