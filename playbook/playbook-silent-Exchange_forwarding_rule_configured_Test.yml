description: |-
  This playbook addresses the following alerts:

  - External Exchange inbox forwarding rule configured
  - Suspicious Exchange inbox forwarding rule configured
  - Suspicious Exchange email-hiding inbox rule
  - Possible BEC Exchange email-hiding inbox rule
  - Exchange email-hiding transport rule based on message keywords
  - Suspicious Exchange email-hiding transport rule
  - Exchange transport forwarding rule configured
  - Suspicious Exchange transport forwarding rule configured

  Playbook Stages:

  Data Collection:

  - The playbook retrieves the original alert data, including the caller's IP address, the forwarding email address, and the forwarding domain.

  Investigation:

  - The playbook performs the following checks in parallel:
    - **IP Reputation**: Enriches the caller's IP address and checks if it is malicious.
    - **Domain Reputation**: Enriches the forwarding address domain and checks if it is malicious.
    - **Working Hours**: Determines whether the rule was configured outside of business hours (22:00–06:00).
    - **Geolocation Anomalies**: Checks whether the caller's IP geolocation or ASN is anomalous (never seen before).
    - **User Risk**: Retrieves user account details and evaluates whether the user has a high-risk score.
    - **Similar Forwarding Rules**: Searches for additional forwarding rules configured within the past 24 hours.
    - **Similar Email-Hiding Rules**: Searches for additional email-hiding rules configured within the past 24 hours.
    - **Alert Severity**: Evaluates the current alert severity level as additional evidence.

  Verdict:

  - The playbook aggregates all evidence collected during the investigation. If the combined evidence score meets the malicious threshold, the playbook proceeds to remediation. If the evidence is inconclusive, the analyst is prompted to manually review the findings and decide whether to proceed with remediation or close the alert as a false positive.

  Remediation:

  - **Severity Adjustment**: The alert severity is increased based on the current level (Low → Medium, Medium → High).
  - **Clear User Session**: The playbook clears the sessions of the user who configured the rule.
  - **Disable User Account**: Upon analyst approval, the playbook disables the user account via Microsoft Graph.
  - **Disable or Delete Rule**: Depending on the rule type:
    - **Inbox Rule**: Disables the rule via EWS Extension Online Powershell, or deletes it via Microsoft Graph Mail if EWS is unavailable.
    - **Transport Rule**: Disables the mail flow transport rule via EWS Extension Online Powershell.

  Requirements:

  For response actions, the following integrations are required:
  - EWS Extension Online Powershell v3 (for disabling inbox and transport rules).
  - Microsoft Graph User (for disabling user accounts and clearing sessions).
  - Microsoft Graph Mail (as a fallback for deleting inbox rules if EWS is unavailable).
