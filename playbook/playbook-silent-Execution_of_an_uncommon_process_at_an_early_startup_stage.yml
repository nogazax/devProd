description: |-
  This playbook is designed to handle the following alerts:
  - Execution of an uncommon process at an early startup stage with suspicious characteristics.
  - Execution of an uncommon process with a local/domain user SID at an early startup stage with suspicious characteristics.

  Playbook Stages:

  Data Collection:
  - Retrieves additional alert data and endpoint information.
  - Collects user risk score (if a username is present).
  - Checks the reputation of the CGO, OS Actor, and Actor process hashes (skipping Microsoft-signed processes).
  - Retrieves the Action process hash prevalence.
  - Queries network connections initiated by processes in the causality chain.
  - Queries file write events related to the action process.

  Investigation:
  - Checks whether the Action process is globally prevalent (potential false positive indicator).
  - Checks the reputation of relevant process hashes (malicious/suspicious).
  - Analyzes command lines for malicious patterns using CommandLineAnalysis.
  - Searches for related alerts indicating malicious or suspicious activity.
  - Checks whether the action was performed on a high-risk host.
  - Checks whether the action was performed by a high-risk user.
  - Checks for network connections to rare or malicious external IPs.
  - Checks for file write events related to the action process and enriches the reputation of the writing process.
  - Checks for potential persistence techniques via registry key modifications.
  - Searches for related alerts indicating known persistence techniques.
  - Checks whether the OS parent process indicates a persistence mechanism.

  Deep Investigation (when initial evidence score is sufficient):
  - Checks if WildFire-v2 integration is available.
  - Retrieves the WildFire verdict for the action process hash.
  - If the hash is unknown to WildFire, retrieves the file from the endpoint and detonates it in the WildFire sandbox.

  Verdict:
  The playbook uses an evidence scoring system to determine the verdict:
  - If no suspicious or malicious evidence is found, the alert is closed as a False Positive.
  - If the total evidence score reaches the threshold, the alert is classified as a True Positive and proceeds to remediation.
  - If the evidence is inconclusive, the analyst is prompted to make a decision (False Positive or True Positive).

  Remediation:
  - Terminates the causality process tree.
  - Quarantines the malicious action process file.
  - Adds malicious process hashes to the block list.
  - Isolates the endpoint (workstations only, requires analyst approval).
  - Blocks malicious external IP addresses.
  - Closes the alert as True Positive (requires analyst approval).
