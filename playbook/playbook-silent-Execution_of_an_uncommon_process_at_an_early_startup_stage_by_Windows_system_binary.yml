description: |-
  This playbook is designed to handle the following alerts:
  - Execution of an uncommon process with a local/domain user SID at an early startup stage with suspicious characteristics by Windows system binary.
  - Execution of an uncommon process at an early startup stage by Windows system binary with suspicious characteristics.

  Playbook Stages:

  Data Collection:
  - Retrieves additional alert data and endpoint information.
  - Enriches the reputation of the target process, initiator process, and OS parent process.
  - Analyzes command lines for malicious patterns.
  - Searches for related alerts indicating malicious or suspicious activity within the case.

  Investigation:
  The investigation follows different flows depending on the persistence techniques and involved processes from the following list:
  - winlogon
  - LogonUI
  - WMI
  - sihost
  - Scheduled tasks
  - Registry keys
  - spoolsv
  - RunOnce
  - Startup Folder
  - Malicious IIS extensions or modules via w3wp.exe

  Verdict:

  Based on the investigation findings, the playbook will either perform remediation actions or close the alert as a false positive.


  Remediation:
  The playbook performs actions to stop the attack and remove persistence mechanisms by:
  - Terminating the malicious causality process.
  - Quarantining the malicious action process file. (Requires analyst approval)
  - Adding malicious process hashes to the block list.
  - Isolating the endpoint (workstations only, requires analyst approval).
  - Searching for and disabling malicious scheduled tasks to remove persistence. (Requires analyst approval)
  - Recommending manual deletion of specific registry keys to remove persistence.
  - Blocking the hash of malicious IIS DLL modules or extensions. (Requires analyst approval)
  - Automatically closing the alert as True Positive or False Positive.
