    task:
      brand: ""
      description: "The alert is suspicious and requires analyst attention for any
        of the following reasons:\n- Evidence is not specific enough to one of the
        involved entities to trigger hard remediation.\n- Enough evidence was found
        for hard remediation, but remediation failed (see errors below).\n- Remediation
        was skipped because the needed integrations are not enabled.\n\nThe evidence,
        any errors, and recommended actions for the analyst are presented below:\n\nConsenting
        admin: ${Core.OriginalAlert.event.identity_name}\n\nApplication owner: ${.=val.AppOwner
        ? val.AppOwner : \"Not found\"}\n\nApp ID: ${AppID}\n\nApp permissions:`${.=val.Core.OriginalAlert.event.app_permissions
        || \"N/A\"}`\n\n\n### Evidence found:\n${.=((function() { var e = val.Evidence
        ? [].concat(val.Evidence) : []; var f = e.filter(x => x.Comment && x.Comment.length
        > 0); return f.length > 0 ? f.map(item => \"1. +\" + item.Name.replace(/_/g,
        \" \").replace(/\\b\\w+\\b/g, (w) => [\"IP\", \"DC\", \"CA\", \"DNS\", \"AI\",
        \"SMB\", \"XQL\", \"ID\", \"URL\", \"CVE\", \"MITRE\", \"OS\", \"RDP\", \"SSH\",
        \"WMI\", \"VNC\", \"TOR\", \"DLL\", \"MD5\", \"SHA1\", \"SHA256\", \"HTTP\",
        \"HTTPS\", \"TCP\", \"UDP\", \"ICMP\", \"URI\", \"AD\", \"SID\", \"GUID\",
        \"UUID\", \"MAC\", \"VM\", \"API\", \"JSON\", \"XML\", \"ISP\", \"AWS\", \"GCP\",
        \"EXE\", \"MSI\", \"BAT\"].includes(w.toUpperCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase()
        + w.slice(1).toLowerCase()) + \"+ - \" + item.Comment).join(\"\\n\") : \"
        \ No Evidence Found.\"; })())}\n\n### Investigation Errors:\n${.=((function()
        { var e = val.Errors? [].concat(val.Errors) : []; var f = e.filter(x => x.Comment
        && x.Comment.length > 0); return f.length > 0 ? f.map(item => \"1. +\" + item.Name.replace(/_/g,
        \" \").replace(/\\b\\w+\\b/g, (w) => [\"IP\", \"DC\", \"CA\", \"DNS\", \"AI\",
        \"SMB\", \"XQL\", \"ID\", \"URL\", \"CVE\", \"MITRE\", \"OS\", \"RDP\", \"SSH\",
        \"WMI\", \"VNC\", \"TOR\", \"DLL\", \"MD5\", \"SHA1\", \"SHA256\", \"HTTP\",
        \"HTTPS\", \"TCP\", \"UDP\", \"ICMP\", \"URI\", \"AD\", \"SID\", \"GUID\",
        \"UUID\", \"MAC\", \"VM\", \"API\", \"JSON\", \"XML\", \"ISP\", \"AWS\", \"GCP\",
        \"EXE\", \"MSI\", \"BAT\"].includes(w.toUpperCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase()
        + w.slice(1).toLowerCase()) + \"+ - \" + item.Comment).join(\"\\n\") : \"
        \ No Errors Found.\"; })())}\n\n\n---\n\n### Recommended Actions\n- Complete
        the playbook investigation steps that failed, if any of them failed. \n- Ensure
        the required integrations are configured correctly and enabled.\n- Ensure
        that the Office 365 data source is configured and that the various azure_msft
        datasets are available."
