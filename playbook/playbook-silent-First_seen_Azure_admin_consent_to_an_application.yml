description: |-
  This playbook addresses the following alert:

  - First seen Azure admin consent to an application

  Playbook Stages:

  Data Collection:

  - Gather initial information about the application and the admin who initiated the consent.
  - Analyze the reputation of the initiating user's IP address.
  - Enrich the admin user with risk information from XSIAM Core and Azure.
  - Retrieve Azure risk detections for the admin user.
  - Extract the application ID and retrieve application details via Microsoft Graph Applications.

  Investigation:

  - Check if the consenting admin user is risky based on Core or Azure risk scores.
  - Check if the app owner is risky in Azure.
  - Check if the app owner or the admin user was recently created in Azure.
  - Check if the user agent used for the consent is suspicious.
  - Check if the source IP address is malicious.
  - Search Azure audit logs for the application registration details and identify the app owner.
  - Check if the app publisher is verified by Microsoft.
  - Check if users with personal accounts are allowed to access the app.
  - Search for app sign-ins from uncommon locations not seen in the past month.
  - Search for app sign-ins blocked by Conditional Access policies.

  Containment:

  - If suspicious evidence is found for the admin user and the Microsoft Graph User integration is enabled, revoke the admin user's sessions.
  - If the app owner is different from the admin, revoke the app owner's sessions as well.
  - If evidence is specific to an involved entity, present a data collection task for the analyst to select remediation actions: disable or remove the application, disable the consenting admin, or disable the app owner.
  - Upon analyst approval, perform the selected remediation actions.

  Requirements:

  For response actions, you need the following integrations:

  - Microsoft Graph User
  - Microsoft Graph Applications
