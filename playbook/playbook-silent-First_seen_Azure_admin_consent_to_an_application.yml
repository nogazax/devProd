  "216":
    continueonerror: true
    continueonerrortype: errorPath
    id: "216"
    ignoreworker: false
    isautoswitchedtoquietmode: false
    isoversize: false
    nexttasks:
      '#error#':
      - "218"
      '#none#':
      - "219"
    note: false
    quietmode: 0
    scriptarguments:
      query:
        simple: |-
          dataset = msft_azure_ad_raw
          | filter isInteractive = true and appId = "${AppID}" // Interactive sign-in to this app
          | alter country = location -> countryOrRegion
          | filter country != null and country != ""
          | alter period = if(timestamp_diff(current_time(), _time, "MILLISECOND") <= 86400000, "Today", "Baseline") // Today vs past month
          | dedup country, period
          | comp values(period) as periods by country
          | filter array_length(arrayfilter(periods, "@element" = "Today")) > 0 and array_length(arrayfilter(periods, "@element" = "Baseline")) = 0 // Filter for countries seen today but not in the past month
          | comp count(country) as NewLocationCount, values(country) as new_locations // Count new locations and aggregate their names
          | alter NewLocationNames = arraystring(new_locations, ", ")
          | fields NewLocationCount, NewLocationNames
      query_name:
        simple: Search for sign-in to an Azure application from a location not seen
          in the past month
      time_frame:
        simple: 30 days
    separatecontext: false
    skipunavailable: false
    task:
      brand: ""
      description: Executes an XQL query against Azure AD sign-in logs to identify
        sign-ins to the consented application from locations not seen in the past
