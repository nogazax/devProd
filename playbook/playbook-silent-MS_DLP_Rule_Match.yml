description: |-
  This playbook addresses the following alert:
  - DLP rule match by user for the first time
  - High-severity DLP sensitive data exposed to external users

  # Playbook Stages:

  ## Data Collection:
  - Gather **extended alert data** (e.g., triggered user, IP address, raw log).

  ## Investigation:
  - Assess the **user's risk level** in Cortex.
  - Search for medium or high **Azure Risk Detections and Defender Alerts**.
  - Search for suspicious **Related Alerts**.
  - Validate the reputation of involved **IP address** (*endpoint only*).
  - Assess the **endpoint's risk level** in Cortex (*endpoint only*).
  - Analyze the **domain** reputation (*exchange only*).

  ## Verdict:
  - At least **1 piece of evidence** -> increase alert severity.

  ## Remediation (*approval needed*):
  - Disable user.
  - Delete Anonymous Links (*onedrive/sharepoint only*).
  - Delete Forwarding Rules (*exchange only*).

  # Requirements:

  ## Investigation:
  - `Azure Risky Users` or `MSGraph Identity and Access` for retrieving **Azure Risk Detections**.
  - `Microsoft 365 Defender` for retrieving **Defender Alerts**.

  ## Remediation:
  - `Microsoft Graph User` for disabling user.
  - `Microsoft Graph Files` for deleting anonymous links.
  - `Microsoft Graph Mail` for deleting forwarding rules.
