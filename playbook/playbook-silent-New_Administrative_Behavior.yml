    scriptarguments:
      extend-context:
        simple: XQL.Scheduler=
      query:
        simple: "dataset = xdr_data\n| alter task_arguments = replace(arrayindex(regextract(action_rpc_func_str_call_fields,
          \"<Arguments>(.*?)<\\/Arguments>\"), 0), \"&gt;\", \">\")\n| alter task_command
          = arrayindex(regextract(action_rpc_func_str_call_fields, \"<Command>(.*?)<\\/Command>\"),
          0)\n| alter task_command_line = concat(arrayindex(regextract(action_rpc_func_str_call_fields,
          \"<Command>(.*?)<\\/Command>\"), 0), \" \", replace(arrayindex(regextract(action_rpc_func_str_call_fields,
          \"<Arguments>(.*?)<\\/Arguments>\"), 0), \"&gt;\", \">\")) \n| alter task_path
          = json_extract_scalar(action_rpc_func_str_call_fields, \"$.path\")\n| filter
          task_command != null and Task_Command not contains \"usoclient.exe\"\n|
          filter event_sub_type = ENUM.RPC_CALL_RPC_CALLED and action_rpc_func_name
          = \"SchRpcRegisterTask\" and agent_ip_addresses in (${Parsed.StringIPs})\n|
          fields event_type, event_sub_type, causality_actor_process_image_path, action_process_image_path,
          actor_process_image_path, agent_hostname , action_rpc_func_name, task_command_line,
          task_arguments, task_command, agent_ip_addresses"
      query_name:
        simple: Scheduler
      time_frame:
        simple: between ${XQL.QueryStartTime} and ${XQL.QueryEndTime}
    separatecontext: false
    skipunavailable: false
