    continueonerrortype: errorPath
    id: "54"
    ignoreworker: false
    isautoswitchedtoquietmode: false
    isoversize: false
    nexttasks:
      '#error#':
      - "75"
      '#none#':
      - "55"
    note: false
    quietmode: 0
    scriptarguments:
      query:
        simple: |-
          dataset = microsoft_windows_raw
          | filter event_id = 4624 and lowercase(host_name) = lowercase("${alert.hostname}")
          | alter target_username = event_data -> TargetUserName
          | alter src_ip = event_data -> IpAddress
          | alter LogonType = event_data -> LogonType
          | alter workstation_name = event_data -> WorkstationName
          | alter AuthenticationPackageName = event_data -> AuthenticationPackageName
          | filter src_ip != "${RequesterHostIP}" AND LogonType = "3" AND lowercase(workstation_name) = lowercase("${Core.OriginalAlert.raw_abioc.event.norm_evtlog_certificate_requester_hostname}") AND AuthenticationPackageName = "NTLM" // Filtering for network logon with the DC machine from an IP that is not that of the DC
          | fields target_username, src_ip, workstation_name
          | sort desc _time
          | limit 1
      query_name:
        simple: Search for relayed NTLM authentication
      time_frame:
        simple: 1 hour
    separatecontext: false
    skipunavailable: true
    task:
      brand: ""
      description: "Uses XQL to query for network logon events (Event ID 4624) that
        occurred on the Certificate Authority (CA) machine, and that came from a machine
        with the same hostname as the requester host, but from an IP that does not
        belong to that host, and that it used NTLM for authentication. \nThe combination
        of these indicators can confirm an ESC-8 attack.\nIt returns the IP of the
        attacker's machine, if found."
      id: d65603d9-6cf9-4426-bff5-e75f0737cfb0
      iscommand: true
      istaskmissingcomponenterrordismissed: false
      name: Search for suspicious authentication to CA server (ESC-8)
