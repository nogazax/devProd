          $dateStr=$ref.ToString(''yyMMdd''); $start=$ref.AddMinutes(-30); $logs=Get-ChildItem
          -Path (''C:\inetpub\logs\LogFiles\W3SVC*\u_ex''+$dateStr+''.log''); $attacker=''null'';
          $msg=''Searching''; $err=''none''; if(-not $logs){$msg=''Failed''; $err=''No
          logs found matching u_ex''+$dateStr+''.log''}else{foreach($l in $logs){$lines=Get-Content
          $l.FullName | Where-Object {$_ -match ''/certsrv/certfnsh.asp'' -and $_
          -match ''POST''}; foreach($line in $lines){$parts=$line.Split('' ''); if($parts.Count
          -ge 9){$logDate=[datetime]::Parse($parts[0]+'' ''+$parts[1]); if($logDate
          -ge $start -and $logDate -le $ref -and $line -match $targetHost -and $parts[8]
          -ne $trustedIP){$attacker=$parts[8]; $msg=''Success''}}}}}; if($attacker
          -eq ''null'' -and $err -eq ''none''){$err=''No matching entry found''};
          ''{''''status'''': ''''''+$msg+'''''', ''''attacker_ip'''': ''''''+$attacker+'''''',
          ''''error'''': ''''''+$err+''''''}''"'
