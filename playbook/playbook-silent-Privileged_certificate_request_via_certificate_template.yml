    separatecontext: false
    skipunavailable: false
    task:
      brand: ""
      description: "Identifies the attacker's IP address by forensic analysis of IIS
        logs following an ESC-8 (NTLM relay) attack against the Web Enrollment Server
        endpoint. The script dynamically constructs the relevant log file name (e.g.,
        u_ex260114.log) based on the alert timestamp, and filters for POST requests
        to the /certsrv/certfnsh.asp endpoint. It applies a 30-minute lookback window
        to isolate the specific certificate issuance event associated with the victim
        hostname.\n\nThe script distinguishes the attacker by comparing the client
        IP (c -ip column) in the logs against the Victim's Trusted IP (the legitimate
        machine being impersonated). Any anomalous IP performing the request on behalf
        of that host within the time window is flagged as the attacker. \n\nThe script
        assumes that:\n\n1. Web Enrollment server is also the Certificate Authority
        that triggered this alert.\n\n2. The logs are at the default locations with
        the default naming conventions.\n\n3. The log structure is left at default,
        with the client IP being at column 8."
