      description: |-
        The certificate request is suspicious and resembles an ESC-8 attack. Please perform the following ESC-8 hardening actions that apply to you:

        Remove Web Enrollment - If your organization does not use the web interface (http://server/certsrv) to request certificates manually, uninstall this role service. This eliminates the attack surface entirely.

        Enable EPA - Extended Protection for Authentication (EPA) forces the NTLM authentication to be bound to the TLS session. This makes relay impossible because the attacker cannot forge the TLS binding.

        Require SSL - EPA requires an encrypted channel to work. You must enforce 'Require SSL' on the virtual directory in IIS (on the Web Enrollment server).

        Disable NTLM - If possible, configure IIS to only accept Kerberos (Negotiate) and remove NTLM on the Web Enrollment server. However, this may break access for non-domain joined clients or legacy applications.
