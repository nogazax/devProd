description: |-
  This playbook addresses the following alerts:

  - Privileged certificate request via certificate template
  - Suspicious privileged certificate request denied via certificate template

  Playbook Stages:

  Data Collection:

  - Retrieves additional alert information from the original alert data.
  - Determines whether the certificate requester is a user account or a machine account.
  - Enriches the requester (user or host) with risk level and additional attributes.
  - Saves the requester's IP address and agent ID for later use in remediation.

  Investigation:

    - Checks if a Domain Controller template was requested by a non-DC machine or user.
    - Extracts and analyzes the User Agent attribute from the certificate request.
    - Checks for suspicious user agents associated with AD CS abuse tools (e.g., Certipy, Rubeus, Impacket, BloodHound).
    - Determines if the certificate request was denied (Event ID 4888).
    - Searches for previous certificate denial events for the requester using XQL.
    - Searches for ESC-8 related alerts and other ESC attack indicators in the case.
    - Enriches and assesses the risk level of the CA server.
    - For user accounts: Checks if the user is unprivileged and requesting a DC template, and assesses user risk level.
    - For machine accounts: Checks if the requester is a DC server and assesses host risk level.
    - Searches for suspicious NTLM authentication events indicating potential ESC-8 relay attacks.
    - Analyzes IIS logs on the CA server to identify attacker IP addresses from NTLM relay attacks.

  Verdict:

  - Evaluates collected evidence scores to determine if remediation is required.
  - If evidence score is below threshold, prompts analyst for manual verdict decision.

  Remediation:
    - Revokes the issued certificate using certutil if a certificate was issued
    - Disables the requester user account in Active Directory (with analyst approval).
    - For identified ESC-8 attacks, blocks the attacker's IP address on the requester host (with analyst approval).
    - Provides manual hardening guidance for the AD CS environment.
    - Increases alert severity to medium for confirmed true positives.
    - Closes the alert with appropriate resolution status.

  Requirements:

  For any response action, you need one of the following integrations:

  - Cortex Core - IR
  - Active Directory Query v2.
