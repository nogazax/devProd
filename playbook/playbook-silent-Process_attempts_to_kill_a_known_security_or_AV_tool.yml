        simple: " config timeframe = 3d case_sensitive = false \n| datamodel dataset
          in(*) \n| filter XDM_ALIAS.ipv4 = \"${RemoteActorIP}\" \n| fields _time\n|
          sort asc _time\n| comp earliest(_time) as first_seen\n| alter hours_beetween_logs
          = timestamp_diff(current_time(),first_seen ,\"HOUR\")\n|alter is_it_new
          = if((hours_beetween_logs<48) or (hours_beetween_logs = null),\"Yes\",\"No\")\n|
          fields is_it_new\n"
      query_name:
        simple: Check_new_remote_actor_ip
