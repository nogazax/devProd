description: |-
  This playbook is designed to handle the 'Process attempts to kill a known security/AV tool' alert.

  The playbook executes the following stages:

  Early Containment:
  - The playbook will perform early containment by terminating the causality chain processes related to the attempt to disable AV tools.

  Data Collection:
  - Retrieves the user risk score.
  - Retrieves the host risk score.
  - Retrieves the endpoint data.
  - Enriches the process SHA-256 hash.

  Investigation:
  During the alert investigation, the playbook will perform the following:
  - Checks whether the action occurred on a high-risk host.
  - Checks whether the action was performed by a high-risk user.
  - Checks if the action was performed by a suspicious remote actor.
  - Searches for related alerts indicating suspicious or malicious activity.
  - Checks the process reputation.
  - Retrieves and analyzes the command line in the same causality chain for malicious activity.

  Verdict:
  - Determines whether the alert is malicious based on the evidence collected during the investigation phase.

  Remediation:
  - Terminates the causality process tree.
  - Disables the involved user (requires analyst approval).
  - Logs off the involved user.
  - Blocks the connection from the remote actor.
  - Blocks the remote host’s IP if it is found to have a malicious reputation.
  - Adds malicious files to the blocklist.
  - Isolates the endpoint (requires analyst approval).
  - Closes the alert (requires analyst approval).
id: silent-Process attempts to kill a known security or AV tool
