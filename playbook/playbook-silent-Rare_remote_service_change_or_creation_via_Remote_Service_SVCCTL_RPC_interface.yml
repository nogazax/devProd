description: |-
  This playbook is designed to handle the following alerts:
  - Rare remote service creation and initiation via Remote Service (SVCCTL) RPC interface
  - Rare remote service change or creation via Remote Service (SVCCTL) RPC interface

  Playbook Stages:

  Analysis:
  - Searches for similar false positive alerts from the same source user or host.
  - Retrieves source host endpoint data and risk score.
  - Retrieves source user data and risk score.
  - Retrieves destination host endpoint data and risk score.
  - Parses and analyzes RPC call fields from the alert.

  Investigation:
  - Checks if the CGO process is unsigned.
  - Checks the CGO file reputation via threat intelligence.
  - Searches for related malware alerts on the source host.
  - Searches for related lateral movement alerts on the destination host.
  - Analyzes the service binary path for suspicious directories (temp, appdata, downloads).
  - Performs command-line analysis on the binary path for malicious patterns.
  - Extracts and analyzes the executable file from the binary path.
  - Checks file reputation via WildFire and threat intelligence feeds.
  - Detects modifications to critical security services (Windows Defender, EDR, logging services).
  - Checks service name prevalence across the organization.
  - Compares current and previous binary path values to detect unauthorized changes.
  - Extracts and analyzes clear-text passwords from command lines.

  Verdict:
  The verdict is determined as malicious if any of the following conditions are met:
  - The total evidence score is 2.5 or higher (based on weighted evidence).
  Examples for that can be:
  - Related malware or lateral movement alerts are found.
  - The CGO process has a malicious reputation.
  - The service binary path contains suspicious directories or malicious command lines.
  - Critical security services were modified or disabled.
  - The service name is non-prevalent in the organization.
  - Significant differences were detected between old and new binary paths.

  Remediation:
  - Terminates the CGO process on the source host.
  - Quarantines malicious CGO files and service executables.
  - Blocks malicious file hashes via blocklist.
  - Stops and disables (only on workstations) newly created or modified malicious services.
  - Reverts critical service configurations if legitimate services were disabled.
  - Blocks network communication between source and destination hosts  for 30 mins (Vise versa if possible. Will not block network connectivity for servers).
  - Logs off the attacking user from active sessions.
  - Disables the user account (requires analyst approval).
  - Isolates the attacking endpoint, target endpoint, or both (requires analyst approval).
  - Automatically closes the alert as True Positive or False Positive.
id: silent-Rare remote service change or creation via Remote Service SVCCTL RPC interface
