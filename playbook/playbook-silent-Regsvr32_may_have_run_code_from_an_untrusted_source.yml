description: "This playbook is designed to handle the following alert:  \n- Regsvr32
  may have run code from an untrusted source\n\nThe playbook executes the following
  stages:\n\nInvestigation Flow:\n - Checks for possible related alerts & insights.\n
  - Checks if the alert triggered by an attack simulation tools.\n - Gets the host
  risk score.\n - Checks for suspicious XML path in the regsvr32 cmd (such as the
  tmp folder)\n - Retrieves the XML file (in some cases, only its content), and analysis
  it.\n - Extracts indicators and enrich them.\n\nVerdict decision Flow:\nThe playbook
  will classify the alert as True Positive if one of the following check is matched:\n
  - The host risk score is high\n - Alert triggered by BAS execution\n - External
  URL reference\n - If there are related alerts\n - if there are related insights
  + host risk score is medium\n - Reputation for XML hash when the XML is on the local
  machine path\n - CMD Analysis will be for: UNC, local path, Internal URL\n - For
  the external URL, the hash will be calculated and blocked automatically in the Remediation
  step\n\nRemediation:\n - Terminate CGO\n - Quarantine XML (in case of local xml
  path )\n - Block IOCs:\n   - Domain and IP over TIM score of suspicious.\n   - XML
  Hash (in cases of External URL or local path).\n   - URL ( only if it is external
  URL).\n - Closes the alert as True Positive or False Positive."
