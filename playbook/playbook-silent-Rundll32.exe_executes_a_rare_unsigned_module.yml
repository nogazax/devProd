description: "This playbook handles the \"Rundll32.exe executes a rare unsigned module\"
  alerts.\n\nThe playbook executes the following stages:\n\nData retrieval:\n- Retrieve
  the alert extra data.\n- Calculate the host risk score.\n- Calculate the user risk
  score.\n- Extract the extension of the loaded DLL.\n- Calculate the similarity between
  the CGO process signer and the loaded DLL's company attribute.\n\nInvestigation:\n-
  Check the DLL reputation.\n- Check the CGO (Causality Group Owner) reputation.\n-
  Check the similarity between the CGO process signer and the loaded DLL's company
  attribute.\n- Check for uncommon DLL extensions.\n- Check for uncommon causality
  chain executions.\n- Check if the attack was triggered by an attack simulation tool.\n-
  Search for related XDR agent alerts to determine if any suspicious behavior occurred
  as part of the causality chain and the related case ID.\n\nRemediation actions will
  be taken if:\n- The loaded DLL is malicious.\n- The CGO is malicious.\n- The DLL
  is loaded from an uncommon causality chain.\n- The DLL extension is uncommon, or
  the DLL's SHA256 is suspicious, and the host risk score is Medium.\n- The host risk
  score is High (and the similarity check is less than 0.6).\n- The user risk score
  is High or Medium.\n- The attack was triggered by an attack simulation tool.\n\n\nRemediation
  actions:\n- Terminate the causality chain. \n- Quarantine suspicious or malicious
  DLLs, if any.\n- Quarantine suspicious or malicious CGO files, if any.\n- Block
  malicious file hashes.\n- Manual review confirmation before closing the alert as
  True Positive.\n\nThe playbook requires enrichment integrations for checking the
  DLL's and CGO's SHA256 reputation.\n"
