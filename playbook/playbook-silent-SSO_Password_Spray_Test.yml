        We found suspicious indicators related to the user's connection or behavior and have taken action automatically by clearing the user's current sessions in Okta.

        Review the findings and decide if the user password should also be expired:

        **User:** ${SuccessfulLoginUsernames}

        **IP:** ${alert.localip}


        ### Evidence found:
        ${.=((function() { var e = val.Evidence ? [].concat(val.Evidence) : []; var f = e.filter(x => x.Comment && x.Comment.length > 0); return f.length > 0 ? f.map(item => "1. +" + item.Name.replace(/_/g, " ").replace(/\b\w+\b/g, (w) => ["IP", "DC", "CA", "DNS", "AI", "SMB", "XQL", "ID", "URL", "CVE", "MITRE", "OS", "RDP", "SSH", "WMI", "VNC", "TOR", "DLL", "MD5", "SHA1", "SHA256", "HTTP", "HTTPS", "TCP", "UDP", "ICMP", "URI", "AD", "SID", "GUID", "UUID", "MAC", "VM", "API", "JSON", "XML", "ISP", "AWS", "GCP", "EXE", "MSI", "BAT"].includes(w.toUpperCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) + "+ - " + item.Comment).join("\n") : "  No Evidence Found."; })())}

        ### Manual Remediation Steps
        If you find this alert malicious. We recommend taking these steps to ensure full remediation:

        **Immediate Actions:** Terminate any active user sessions in your authentication system to prevent continued access from the suspicious location. Reset the user's password and invalidate any existing authentication tokens or refresh tokens.

        **MFA Enforcement:** Ensure multi-factor authentication is enabled and properly configured for the user. Consider requiring re-enrollment of MFA devices if there are concerns about device compromise.
