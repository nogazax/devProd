description: |-
  This playbook is designed to handle the following alerts:
  - Possible LDAP enumeration by unsigned process.
  - Suspicious LDAP search query executed.

  The playbook executes the following stages:

  Data Collection:
  - Retrieves additional alert data using the cloud original alerts API.
  - Gathers endpoint information including risk level, isolation status, and endpoint type.
  - Checks hash reputation for the CGO, OS Actor, and Actor processes (skipping Microsoft-signed binaries).
  - Runs prevalence analysis on the Actor process.
  - Retrieves the user risk score (if a username is associated with the alert).

  Investigation:
  The playbook evaluates the following parameters to determine if remediation actions are needed:
  - Cortex XSIAM alerts related to the hostname by MITRE tactics (T1059 - Command and Scripting Interpreter) and Agent alerts.
  - Whether the activity was triggered by a known attack simulation tool (e.g., Cymulate, SafeBreach, AttackIQ, Caldera, Atomic Red Team).
  - Checks for the prevalence of the CGO process.
  - User risk score is "High".
  - Host risk score is "Medium" or "High".
  - Process reputation (malicious or suspicious) based on TIM scoring.
  - Command-line analysis with risk scoring and IOC extraction with reputation checks.

  Verdict:
  - Uses an evidence-based scoring system to classify the alert:
    - If the total evidence score is 3 or above → True Positive → Automatic remediation.
    - If no evidence and no errors → False Positive → Automatic closure.
    - Otherwise → Analyst decision required (with evidence summary).

  Remediation:
  - Terminates the causality process (CGO) with manual fallback on failure.
  - Blocks malicious indicators:
    - IP addresses via external blocking integrations.
    - File hashes (SHA256) via the Cortex Core blocklist.
    - URLs via PAN-OS Custom URL Category.
    - Domains via Cortex Core indicator rules (with manual blocking instructions).
  - Logs off the user from the affected endpoint.
  - Disables the user account via Active Directory (with analyst approval).
  - Isolates the endpoint (with analyst approval, excluding servers and disconnected endpoints).
  - Closes the alert as True Positive with analyst confirmation.
