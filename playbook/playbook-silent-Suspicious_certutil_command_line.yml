description: |-
  This playbook addresses the following alerts:
  - Suspicious certutil command line

  Playbook Stages:

  Data Collection:
  - Retrieves the full details of the original alert, including causality chain and process data.
  - Gathers detailed information about the involved endpoint, such as its OS, user, and network status.

  Investigation:
  - Analyzes the certutil command line arguments to identify suspicious patterns, encoding, or parameters.
  - Extracts any URLs from the command line and assesses their reputation and threat level.
  - Checks the prevalence of the involved processes to identify rare or non-prevalent executables.
  - Determines if the initiating process or causality group owner is unsigned, which may indicate tampering.
  - Scans the parent process command line for scripting characteristics indicative of obfuscation or complex execution.
  - Searches for related security alerts on the same endpoint, looking for scheduled task creation.
  - Queries for any files created by the certutil process on the endpoint.
  - If a file was created, its hash is enriched to determine its reputation and potential maliciousness.
  - Checks for subsequent execution events involving any files dropped by the certutil process.

  Remediation:
  - Terminates the entire process tree that originated from the suspicious certutil command.
  - Isolates the affected endpoint from the network to prevent lateral movement (requires analyst approval).
  - Disables the user account associated with the activity to prevent further access (requires analyst approval).
  - Blocks any malicious URLs found during the investigation at the firewall (requires analyst approval).
  - Quarantines any malicious files dropped by the certutil process on the endpoint (requires analyst approval).
  - Closes the alert, marking it as a true positive after remediation actions are complete.
  - If determined to be a false positive, closes the alert with the appropriate resolution status.
