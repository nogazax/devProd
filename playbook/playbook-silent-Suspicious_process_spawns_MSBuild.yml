          in (ENUM.PROCESS, ENUM.FILE, ENUM.REGISTRY)\n| filter (\n    // MSBuild
          process and its children (using exact match for precision and efficiency)\n
          \   (event_sub_type = ENUM.PROCESS_START and (\n        lowercase(actor_process_image_name)
          ~= \"msbuild.exe\" or\n        lowercase(causality_actor_process_image_name)
          ~= \"msbuild.exe\"\n    )) or\n    \n    // Files created by MSBuild or
          its children\n    (event_type = ENUM.FILE and \n         event_sub_type
          in (ENUM.FILE_WRITE, ENUM.FILE_CREATE_NEW)  and\n        lowercase(causality_actor_process_image_name)
          ~= \"msbuild.exe\" and\n        lowercase(action_file_extension) in (\"exe\",
          \"dll\", \"bat\", \"cmd\", \"ps1\", \"vbs\", \"js\", \"jar\", \"scr\")\n
          \   ) or\n    \n    // Registry modifications for persistence (Logically
          Grouped and Precise)\n    (event_type = ENUM.REGISTRY and \n        lowercase(causality_actor_process_image_name)
          ~= \"msbuild.exe\" and\n        (\n            action_registry_key_name
          contains \"\\\\CurrentVersion\\\\Run\" or // Using contains for path filtering\n
          \           action_registry_key_name contains \"\\\\Winlogon\\\\\" or\n
          \           action_registry_key_name contains \"\\\\Services\\\\\"\n        )\n
          \   ) or\n    \n    // Scheduled tasks creation\n    (event_type = ENUM.PROCESS
          and\n        lowercase(causality_actor_process_image_name) ~= \"msbuild.exe\"\n
          \   )\n)\n| fields event_timestamp, event_type, agent_hostname, actor_process_image_name,
          action_process_image_name, action_process_image_path, action_process_image_command_line,
          action_file_path, action_file_name, action_registry_key_name, action_registry_value_name,
          causality_actor_process_image_name, causality_actor_process_command_line\n|
          limit 5000 \n| sort asc event_timestamp"
