description: "This playbook addresses the following alerts:\n \n- Uncommon creation
  or access operation of sensitive shadow copy by a high-risk process\n \nPlaybook
  Stages:\n  \nTriage: \n \n- Check if the causality process image (CGO) is signed
  or not\n \nInvestigation:\n \n- If CGO is unsigned:\n  - Check the CGO process prevalence\n
  \ - Check if the process image path is common\n  - Check the CGO process hash reputation\n
  \ - Check the CGO commandline risk score\n- If CGO is signed:\n  - Check process
  image name\n  - Check initiating process image name\n  - Check if username is SYSTEM\n
  \ - Check if host is a server\n  - Check for previous similar alert closed as False
  Positive\n \nContainment:\n \n- Terminate causality process (CGO) process - when
  a signed high-risk process or an unsigned process from an uncommon path attempting
  to create or access sensitive shadow copy data."
