    scriptarguments:
      query:
        simple: "dataset = saas_audit_logs\n| filter identity_name = \"${Core.OriginalAlert.event.identity_name}\"
          and vendor = \"MSFT\" and operation_name_orig = \"Send\"\n| alter MsgID
          = raw_log -> Item.InternetMessageId\n| filter MsgID in ${MessageIDsQuery}\n\n//
          --- Time Proximity Logic Starts Here ---\n\n// // 1. Define and convert
          alert timestamp to timestamp in milliseconds (alert timestamps are in seconds).
          Convert event timestamps to timestamp objects as well.\n| alter EventTimestampObj
          = to_timestamp(event_timestamp , \"MILLIS\")\n| alter AlertEpochTime = multiply(${AlertTimestampEpochSeconds},
          1000)  // not in Milliseconds, need to multiply\n| alter AlertTimestampObj
          = to_timestamp(AlertEpochTime, \"MILLIS\")\n\n\n// 2. Calculate the difference
          between the event time and the target time in MINUTES.\n// We use the event's
          event_timestamp field. The result can be positive (event is later) or negative
          (event is earlier).\n| alter time_diff_minutes = timestamp_diff(EventTimestampObj,
          AlertTimestampObj, \"MINUTE\")\n\n| fields MsgID, EventTimestampObj, AlertTimestampObj,
          time_diff_minutes \n\n// 3. Filter for records where the absolute difference
          is 60 minutes (1 hour) or less.\n| filter time_diff_minutes <= 60 and time_diff_minutes
          >= -60\n\n// 4. Aggregate to count the results that passed the time proximity
          filter.\n| comp count() as count_within_1_hour, values(MsgID) as message_id_list"
      query_name:
        simple: Search for emails sent within 1 hour from the time of the alert.
      time_frame:
        simple: 1 day
    separatecontext: false
    skipunavailable: true
    task:
      brand: ""
      description: Searches the SAAS audit logs using XQL to find the timestamps of
