description: |-
  This playbook addresses the following alert:
  - Certificate template vulnerable to AD CS ESC attack
  - First detection of AD CS ESC vulnerability in certificate template

  # Playbook Stages:

  ## Data Collection:
  - Gather **extended alert data** (e.g., vulnerable template fields, identified ESC technique).

  ## Investigation:
  - **Issued Certificates Analysis**: Search for certificates issued using the vulnerable template within the past 1 day.
  - **Related Alerts Analysis**: Search for other Active Directory Certificate Services (AD CS) related alerts (ESC techniques) in the same case.
  - **First Detection**: Check if this is the first time this specific template has been flagged as vulnerable.

  ## Verdict:
  - Calculate an **evidence score** based on issued certificates, related high/low alerts, and first-time detections.

  ## Remediation:
  - **Template Mitigations**: Provide specific descriptions and mitigation steps for the identified ESC technique (ESC1, ESC2, etc.).
  - **Disable Vulnerable Template**: Offer the option to disable the vulnerable template.
  - **Certificate Revocation**: If certificates were issued, provide the option to revoke the last issued certificate.
  - **User Remediation**: Provide the option to disable the requester's user account in Active Directory.

  # Requirements:

  ## Investigation:
  - `XQL Query Engine` for searching issued certificates.

  ## Remediation:
  - `Active Directory Query v2` for disabling user accounts.
