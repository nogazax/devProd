description: This playbook investigates and responds to alerts indicating rare or
  suspicious child processes spawned by WmiPrvSe.exe, which may indicate lateral movement
  or remote code execution via Windows Management Instrumentation (WMI). The playbook
  collects relevant alert data, analyzes the process tree for suspicious patterns
  such as WMI-related processes spawning scripting engines (PowerShell, cmd.exe),
  and performs containment actions including process termination when malicious activity
  is confirmed.
