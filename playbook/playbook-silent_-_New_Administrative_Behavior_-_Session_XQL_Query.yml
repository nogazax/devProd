  "1":
    continueonerrortype: ""
    id: "1"
    ignoreworker: false
    isautoswitchedtoquietmode: false
    isoversize: false
    nexttasks:
      '#none#':
      - "2"
    note: false
    quietmode: 0
    scriptarguments:
      query:
        simple: "preset in (xdr_process, xdr_file)\n\n// 2. Target Specifics\n| filter
          agent_ip_addresses = \"${inputs.session.ip}\" \n| filter actor_effective_username
          = \"${inputs.username}\"\n\n| alter action_file_extension = arrayindex(split(action_file_name,
          \".\"), 1)\n\n// 3. Suspicious Activity Filter\n| filter \n    // A. Scripting,
          Admin Tools, & Living off the Land (Execution)\n    // Updated: Now includes
          ALL usage of net.exe and net1.exe\n    (event_type = ENUM.PROCESS and actor_process_image_name
          in (\n        \"powershell.exe\", \"pwsh.exe\", \"cmd.exe\", \"net.exe\",
          \"net1.exe\", \"wscript.exe\",  \"cscript.exe\", \"mshta.exe\", \"bitsadmin.exe\",
          \"certutil.exe\", \"rundll32.exe\"))\n    \n    or\n\n    (event_type =
          ENUM.PROCESS and os_actor_process_image_name in (\n        \"powershell.exe\",
          \"pwsh.exe\", \"cmd.exe\", \"net.exe\", \"net1.exe\", \"wscript.exe\",  \"cscript.exe\",
          \"mshta.exe\", \"bitsadmin.exe\", \"certutil.exe\", \"rundll32.exe\"))\n
          \   \n    or \n\n    // B. Persistence & Service Modification\n    (event_type
          = ENUM.PROCESS and action_process_image_name in (\"schtasks.exe\", \"sc.exe\",
          \"reg.exe\", \"at.exe\"))\n\n    or \n\n    // C. Defense Evasion (Clearing
          logs)\n    (event_type = ENUM.PROCESS and (action_process_image_command_line
          contains \"wevtutil\" or action_process_image_command_line contains \"fltmc\"))\n\n
          \   or \n    \n    // D. Data Staging (Compression Tools Creating Files)\n
          \   (event_type = ENUM.FILE and event_sub_type = ENUM.FILE_CREATE_NEW and
          \n     actor_process_image_name in (\"7z.exe\", \"7zG.exe\", \"WinRAR.exe\",
          \"rar.exe\", \"WinZip32.exe\", \"WinZip64.exe\", \"tar.exe\", \"gzip.exe\"))\n\n
          \   or \n\n    // E. Suspicious File Locations (Running from Temp/Public)\n
          \   (event_type = ENUM.PROCESS and (action_process_image_path contains \"\\AppData\\Local\\Temp\"
          or action_process_image_path contains \"\\Users\\Public\"))\n\n    or\n\n
          \   // F. Browser/User Downloads\n    (event_type = ENUM.FILE and event_sub_type
          = ENUM.FILE_CREATE_NEW and \n        (action_file_path contains \"\\Downloads\\\"
          or \n        (actor_process_image_name in (\"chrome.exe\", \"msedge.exe\",
          \"firefox.exe\", \"brave.exe\") and action_file_extension in (\"exe\", \"msi\",
          \"bat\", \"ps1\", \"vbs\", \"iso\", \"zip\", \"7z\")))\n    )\n\n    or\n\n
          \   // G. Lateral Movement & Remote Access Tools\n    // Note: net.exe was
          moved to Section A, so this now focuses purely on connection tools\n    (event_type
          = ENUM.PROCESS and action_process_image_name in (\"mstsc.exe\", \"putty.exe\",
          \"plink.exe\", \"winscp.exe\", \"tscon.exe\"))\n\n\n// 4. NOISE REDUCTION
          (Filter OUT common benign activity)\n| filter\n    \n    // Exclude standard
          login drive mappings (Customize drive letters as needed)\n    (action_process_image_command_line
          not contains \"net use Z:\" and action_process_image_command_line not contains
          \"net use X:\")\n    \n    and \n    \n    // Exclude Windows Update / Microsoft
          Signing checks (certutil noise)\n    (action_process_image_command_line
          not contains \"windowsupdate\" and action_process_image_command_line not
          contains \"microsoft.com\")\n\n    and\n\n    // Exclude Windows Time Synchronization
          tasks\n    (action_process_image_command_line not contains \"w32time\" and
          action_process_image_command_line not contains \"task_started\")\n    \n
          \   and\n\n    // Exclude Microsoft Store PushToInstall service\n    (action_process_image_command_line
          not contains \"pushtoinstall\")\n\n    and\n    \n    // Exclude Chrome
          temporary download files\n    (action_file_extension != \"crdownload\" and
          action_file_extension != \"tmp\")\n    \n    and \n    \n    causality_actor_process_image_name
          not in (\"cyserver.exe\")\n\n    and\n    \n    // Exclude specific processes\n
          \   actor_process_image_name not in (\"cleanmgr.exe\")\n        \n    and
          \n    \n    action_process_image_name not in (\"conhost.exe\")\n    \n    and
          \n\n    action_process_image_command_line not contains \"sc.exe start wuauserv\"\n\n\n//
          5. Final Output\n| alter Action = coalesce(action_process_image_command_line,
          replace(action_file_path, \":Zone.Identifier\", \"\"))\n| alter action_file_name
          = replace(action_file_name, \":Zone.Identifier\", \"\")\n| alter action_file_path
          = replace(action_file_path, \":Zone.Identifier\", \"\")\n\n| fields _time,
          event_type, event_sub_type, actor_effective_username, causality_actor_process_image_name,
          os_actor_process_image_name, actor_process_image_name, action_process_image_name,
          action_file_name, action_file_path, Action, action_file_sha256 , agent_ip_addresses\n|
          sort asc _time"
      query_name:
        simple: ${inputs.protocol}_Commands
      time_frame:
        simple: between ${inputs.session.session_start} and ${inputs.session.session_end}
