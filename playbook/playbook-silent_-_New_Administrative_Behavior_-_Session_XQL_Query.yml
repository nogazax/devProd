description: Executes an XQL query to identify suspicious administrative activity
  (scripting tools, persistence mechanisms, defense evasion, data staging, and lateral
  movement) within a specified session timeframe, filtering out common benign operations.
id: silent - New Administrative Behavior - Session XQL Query
inputSections:
- description: Session details and query configuration parameters.
  inputs:
  - session
  - protocol
  - username
  name: General (Inputs group)
inputs:
- description: 'Expects a JSON object in the following structure {"ip": <ip_address>,
    "session_start": <timestamp>, "session_end": <timestamp>}. The subplaybook uses
    these to build the query to check for suspicious activity in a session.'
  key: session
  playbookInputQuery: null
  required: true
  value: {}
- description: The name of the protocol used in the session. The result will be saved
    in the context under <protocol>_Commands.
  key: protocol
  playbookInputQuery: null
  required: true
  value: {}
- description: The username that initiated the session, the query uses it to filter
    results.
  key: username
  playbookInputQuery: null
  required: true
  value: {}
issilent: true
name: silent - New Administrative Behavior - Session XQL Query
